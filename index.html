<!DOCTYPE html>
<html lang="en-us">
    <!-- HEAD -->
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="no">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <meta name="author" content="Vesa Timonen">

        <link rel="shortcut icon" href="images/icon.png"/>
        <link rel="apple-touch-icon-precomposed" href="images/icon.png" />

        <link rel="stylesheet" href="css/styles.css?v=1">

        <title>ESP CALCULATOR</title>

    </head>

    <!-- BODY -->
    <body id="game-screen">
        <!-- TITLE -->
        <div id="game-title">
            ESP CALCULATOR
        </div>


        <!-- CALCULATOR AREA -->
        <div id="game-board">
            <!-- DISPLAY -->
            <div id="calc-display">0</div>

            <!-- KEYPAD, data-key tells what key does -->
            <div id="calc-keys">
                <button class="button calc-key" data-key="7">7</button>
                <button class="button calc-key" data-key="8">8</button>
                <button class="button calc-key" data-key="9">9</button>
                <button class="button calc-key calc-op" data-key="*" aria-label="Circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg></button>

                <button class="button calc-key" data-key="4">4</button>
                <button class="button calc-key" data-key="5">5</button>
                <button class="button calc-key" data-key="6">6</button>
                <button class="button calc-key calc-op" data-key="-" aria-label="Plus"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg></button>

                <button class="button calc-key" data-key="1">1</button>
                <button class="button calc-key" data-key="2">2</button>
                <button class="button calc-key" data-key="3">3</button>
                <button class="button calc-key calc-op" data-key="+" aria-label="Waves"><svg viewBox="0 0 24 24"><path d="M3 5q4.5-4.8 9 0t9 0M3 12q4.5-4.8 9 0t9 0M3 19q4.5-4.8 9 0t9 0"/></svg></button>

                <button class="button calc-key calc-func" data-key="clear">C</button>
                <button class="button calc-key" data-key="0">0</button>
                <button class="button calc-key calc-func" data-key="=">=</button>
                <button class="button calc-key calc-op" data-key="/" aria-label="Square"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17"/></svg></button>
            </div>
        </div>

        <!-- SCRIPTS -->
        <script src="js/globals.js?v=1"></script>
        <script src="js/calc.js?v=1"></script>
        <script src="js/UI.js?v=1"></script>
        <script src="js/UI_window.js?v=1"></script>
        <script src="js/UI_buttons.js?v=1"></script>
        <script src="js/main.js?v=2"></script>
    </body>
</html>
